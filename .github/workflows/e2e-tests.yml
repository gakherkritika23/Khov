name: E2E Tests

# Manual trigger with three dropdowns: environment, suite, browser.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        default: dev
        options: [dev, stage, prod]
      suite:
        description: "Test suite"
        type: choice
        default: smoke
        options: [smoke, regression, all]
      browser:
        description: "Browser"
        type: choice
        default: chromium
        # Add firefox / webkit here once their projects are uncommented in playwright.config.ts.
        options: [chromium]

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Binds the chosen dev/stage/prod GitHub Environment so its Variables + Secret load.
    environment: ${{ inputs.environment }}
    env:
      CI: "true" # switches playwright.config to trace + video on failure
      TEST_ENV: ${{ inputs.environment }}
      BASE_URL: ${{ vars.BASE_URL }}
      # --- ReportPortal: DISABLED for now ---------------------------------------
      # We're validating CI with the Playwright HTML report first. To enable live
      # ReportPortal reporting later: add RP_ENDPOINT + RP_PROJECT as Environment
      # Variables and RP_API_KEY as an Environment Secret, then uncomment these 3
      # lines. (playwright.config.ts turns RP on automatically once RP_API_KEY is set.)
      # RP_ENDPOINT: ${{ vars.RP_ENDPOINT }}
      # RP_PROJECT: ${{ vars.RP_PROJECT }}
      # RP_API_KEY: ${{ secrets.RP_API_KEY }}
      # -------------------------------------------------------------------------

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps ${{ inputs.browser }}

      # "all" runs the whole project; otherwise filter to the @smoke / @regression tag.
      - name: Run tests
        run: |
          GREP=""
          if [ "${{ inputs.suite }}" != "all" ]; then GREP="--grep @${{ inputs.suite }}"; fi
          npx playwright test --project=${{ inputs.browser }} $GREP

      # HTML report + traces/videos/screenshots + JUnit XML, uploaded even on failure.
      - name: Upload report & results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ inputs.environment }}-${{ inputs.suite }}
          path: |
            playwright-report/
            test-results/
            results.xml
          retention-days: 14
          if-no-files-found: ignore
